<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="100%" height="100%">
  <defs>
    <!-- Background glow gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff3d5a" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#7a0f24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07070a" stop-opacity="0" />
    </radialGradient>

    <!-- Crimson rim light gradient -->
    <linearGradient id="rimLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d5a" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#e5132b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e5132b" stop-opacity="0" />
    </linearGradient>

    <!-- Cyan accent rim light right -->
    <linearGradient id="rimRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="70%" stop-color="#121217" />
      <stop offset="100%" stop-color="#07070a" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#2a1f28" />
      <stop offset="60%" stop-color="#141118" />
      <stop offset="100%" stop-color="#09080c" />
    </linearGradient>

    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b4a1" />
      <stop offset="60%" stop-color="#b8937e" />
      <stop offset="100%" stop-color="#805d4b" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="visorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5132b" />
      <stop offset="50%" stop-color="#ff6b81" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <rect width="720" height="900" fill="url(#bgGlow)" />

  <!-- Geometric Tech Circle Backdrop -->
  <g opacity="0.35">
    <circle cx="360" cy="380" r="260" fill="none" stroke="#e5132b" stroke-width="1.5" stroke-dasharray="16 10" />
    <circle cx="360" cy="380" r="310" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2" />
    <circle cx="360" cy="380" r="210" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6" />
    <!-- Crosshairs and data marks -->
    <line x1="80" y1="380" x2="130" y2="380" stroke="#ff3d5a" stroke-width="2" />
    <line x1="590" y1="380" x2="640" y2="380" stroke="#ff3d5a" stroke-width="2" />
    <line x1="360" y1="100" x2="360" y2="150" stroke="#38bdf8" stroke-width="2" />
    <text x="360" y="90" text-anchor="middle" fill="#a7a6ad" font-family="'Inter', monospace" font-size="12" letter-spacing="4">VYSHNAVI · DEV PORTFOLIO</text>
  </g>

  <!-- Character Silhouette & Lighting -->
  <g id="character">
    <!-- Back Hair Flow -->
    <path d="M220 300 C200 420 210 580 250 670 C270 540 280 430 280 340 Z" fill="url(#hairGrad)" opacity="0.9" />
    <path d="M500 300 C520 420 510 580 470 670 C450 540 440 430 440 340 Z" fill="url(#hairGrad)" opacity="0.9" />

    <!-- Shoulders / Torso / Developer Jacket -->
    <path d="M120 900 C130 760 190 630 270 570 L360 620 L450 570 C530 630 590 760 600 900 Z" fill="url(#bodyGrad)" />

    <!-- Collar & Zip Accent -->
    <path d="M270 570 L360 640 L450 570" fill="none" stroke="#e5132b" stroke-width="4" stroke-linecap="round" />
    <path d="M360 640 L360 900" fill="none" stroke="#ff3d5a" stroke-width="2.5" stroke-dasharray="10 5" opacity="0.8" />
    <!-- Lapels -->
    <path d="M270 570 L340 700 L360 640" fill="#1b1a22" />
    <path d="M450 570 L380 700 L360 640" fill="#201f29" />

    <!-- Neck -->
    <path d="M315 470 L405 470 L415 590 L305 590 Z" fill="#9d7660" />
    <path d="M305 520 C325 560 395 560 415 520" fill="none" stroke="#6f503e" stroke-width="3" />

    <!-- Head / Face Silhouette -->
    <path d="M360 250 C290 250 280 330 285 410 C290 470 330 535 360 540 C390 535 430 470 435 410 C440 330 430 250 360 250 Z" fill="url(#faceGrad)" />

    <!-- Ears -->
    <ellipse cx="282" cy="410" rx="9" ry="20" fill="#ad8771" />
    <ellipse cx="438" cy="410" rx="9" ry="20" fill="#ad8771" />

    <!-- Minimalist stylized features -->
    <!-- Eyebrows -->
    <path d="M312 375 Q335 365 348 375" fill="none" stroke="#251c17" stroke-width="3.5" stroke-linecap="round" />
    <path d="M372 375 Q385 365 408 375" fill="none" stroke="#251c17" stroke-width="3.5" stroke-linecap="round" />
    <!-- Soft eyes -->
    <path d="M315 392 Q332 384 345 394" fill="none" stroke="#1d1612" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="332" cy="392" r="4.5" fill="#16120e" />
    <circle cx="334" cy="390" r="1.5" fill="#ffffff" />

    <path d="M375 394 Q388 384 405 392" fill="none" stroke="#1d1612" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="388" cy="392" r="4.5" fill="#16120e" />
    <circle cx="390" cy="390" r="1.5" fill="#ffffff" />

    <!-- Nose bridge -->
    <path d="M360 380 L357 435 L366 442" fill="none" stroke="#8a614d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Subtle smile -->
    <path d="M342 475 Q360 488 378 475" fill="none" stroke="#8a4d46" stroke-width="3" stroke-linecap="round" />
    <path d="M348 480 Q360 493 372 480" fill="none" stroke="#c06860" stroke-width="2" stroke-linecap="round" />

    <!-- Hair (Front & bangs) -->
    <path d="M265 310 C270 230 350 200 400 215 C460 230 460 310 455 350 C440 280 400 260 360 260 C320 260 285 275 270 330 Z" fill="url(#hairGrad)" />
    <!-- Hair strands flow down gracefully -->
    <path d="M265 320 C250 370 260 480 275 540 C285 460 280 370 290 320 Z" fill="#1f1821" />
    <path d="M455 320 C470 370 460 480 445 540 C435 460 440 370 430 320 Z" fill="#18131a" />
    <!-- Sleek hair partition strand -->
    <path d="M330 240 Q305 290 290 340" fill="none" stroke="#332737" stroke-width="4" stroke-linecap="round" />
    <path d="M380 235 Q415 280 435 340" fill="none" stroke="#251c27" stroke-width="4" stroke-linecap="round" />

    <!-- Studio Rim Light (Crimson Neon along left side) -->
    <path d="M140 900 C150 780 205 650 275 580 C265 520 255 420 265 310 C270 240 330 210 360 210" fill="none" stroke="url(#rimLeft)" stroke-width="7" filter="url(#glowFilter)" />
    <path d="M272 575 C260 500 262 430 270 340" fill="none" stroke="#ff3d5a" stroke-width="3" opacity="0.9" />

    <!-- Studio Edge Light (Cyan Neon along right side) -->
    <path d="M580 900 C570 780 515 650 445 580 C455 520 465 420 455 310 C450 240 390 210 360 210" fill="none" stroke="url(#rimRight)" stroke-width="5" filter="url(#glowFilter)" />

    <!-- Audio / Developer Tech Headset (Cinematic Touch) -->
    <path d="M268 360 C265 290 310 250 360 250 C410 250 455 290 452 360" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <rect x="256" y="360" width="22" height="54" rx="8" fill="#1e293b" stroke="#e5132b" stroke-width="2" />
    <rect x="442" y="360" width="22" height="54" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Microphone boom -->
    <path d="M265 410 Q285 450 330 450" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <circle cx="334" cy="450" r="4.5" fill="#e5132b" />

    <!-- Bottom gradient shadow fade -->
    <rect x="0" y="760" width="720" height="140" fill="url(#bodyGrad)" opacity="0.85" />
  </g>
</svg>
